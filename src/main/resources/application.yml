spring:
  application:
    name: allo-bank-finance-api
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  output:
    ansi:
      enabled: always

server:
  port: 8080
  servlet:
    context-path: /

frankfurter:
  api:
    base-url: https://api.frankfurter.app

# GitHub username for spread factor calculation
# Change this to your actual GitHub username
github:
  username: demo-user

logging:
  level:
    root: INFO
    com.allobank: DEBUG
    org.springframework.web: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
