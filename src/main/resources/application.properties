#App Name
spring.application.name=allorestapi

# Server
server.port=8081

# Frankfurter API
frankfurter.base-url=https://api.frankfurter.app

# Historical date window
frankfurter.historical.start-date=2024-01-01
frankfurter.historical.end-date=2024-01-05
frankfurter.historical.from-currency=IDR
frankfurter.historical.to-currency=USD

# Logging
logging.level.com.example.frankfurter=DEBUG
logging.level.org.springframework.web.reactive.function.client=WARN

# Jackson configuration for BigDecimal handling
spring.jackson.deserialization.use-big-decimal-for-floats=true
spring.jackson.generator.write-bigdecimal-as-plain=true

# Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha