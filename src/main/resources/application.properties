spring.application.name=frankfurter

# Frankfurter API
frankfurter.api.base-url=https://api.frankfurter.app
frankfurter.api.currencies-path=/currencies
frankfurter.api.latest-rates-path=/latest?base=IDR
frankfurter.api.historical-rates-path=/%s..%s?from=IDR&to=USD
frankfurter.api.historical-rates-start-date=2024-01-01
frankfurter.api.historical-rates-end-date=2024-01-05

# WebClient timeouts
# frankfurter.api.connect-timeout=5000
# frankfurter.api.read-timeout=5000

