server:
  port: 9990

spring:
  application:
    name: currency-service
  cache:
    type: caffeine
    cache-names:
      - supportedCurrencies
      - latestIdrUsd
      - historicalIdrUsd
    caffeine:
      spec: maximumSize=300,expireAfterAccess=30m

external:
    api:
        base-url: https://api.frankfurter.dev/v1

logging:
    level:
      org.springframework.cache: DEBUG
