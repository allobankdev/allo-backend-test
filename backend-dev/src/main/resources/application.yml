spring:
  application:
    name: allobank-backend-test

app:
  frankfurter:
    base-url: https://api.frankfurter.app
    # timeouts in milliseconds
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

personal:
  github-username: "weakbaby2"
  resource-types:
    latest: latest_idr_rates
    historical: historical_idr_usd
    supported: supported_currencies
    
  default-dates:
    historical-start: "2024-01-01"
    historical-end: "2024-01-05"
  
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
  connection-timeout: 100s  

logging:
  level:
    root: INFO
    com.example.allobank: DEBUG
