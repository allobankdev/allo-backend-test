external:
  api:
    frankfurter:
      base-url: https://api.frankfurter.app
      endpoints:
        latest: "/latest?base=IDR"
        historical: "/{range}?from=IDR&to=USD"
        currencies: "/currencies"
      connect-timeout: 5000
      read-timeout: 5000

app:
  finance:
    github-username: aldobuarlele
    resource-types:
      latest: latest_idr_rates
      historical: historical_idr_usd
      currencies: supported_currencies
    historical-range: "2024-01-01..2024-01-05"